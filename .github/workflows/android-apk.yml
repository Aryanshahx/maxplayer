# GitHub Actions — build the release APK on every push to main.
# The runner is standard x64 Ubuntu with the official Flutter stable,
# so the Pi's older local SDK never blocks anything. Download the APK
# from the workflow run's "Artifacts" section (sign in from any device).
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable   # latest stable Flutter (Dart >= 3.13)
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # These are compile-time values. If OPENROUTER_API_KEY is not a
      # repository secret with this exact name, the APK will contain an empty
      # value and Ask AI will correctly report that the key is missing.
      - name: Check API secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is empty. Add it under Settings > Secrets and variables > Actions > Repository secrets, then run this workflow again."
            exit 1
          fi
          echo "TMDB_API_KEY: ${TMDB_API_KEY:+configured (TMDB fallback is also available)}"
          echo "OPENROUTER_API_KEY: configured (length ${#OPENROUTER_API_KEY})"

      # Signed with the debug-key fallback for now (installable on your
      # phone for testing). The values are passed through env variables so
      # shell quoting and GitHub masking cannot turn a configured secret into
      # an empty dart-define.
      - name: Build release APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          flutter build apk --release \
            "--dart-define=TMDB_API_KEY=$TMDB_API_KEY" \
            "--dart-define=OPENROUTER_API_KEY=$OPENROUTER_API_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: maxplayer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
