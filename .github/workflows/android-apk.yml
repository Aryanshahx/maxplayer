# GitHub Actions — build the release APK on every push to main.
# The runner is standard x64 Ubuntu with the official Flutter stable,
# so the Pi's older local SDK never blocks anything. Download the APK
# from the workflow run's "Artifacts" section (sign in from any device).
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable   # latest stable Flutter (Dart >= 3.13)
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Signed with the debug-key fallback for now (installable on your
      # phone for testing). Real Play signing arrives when we wire the
      # keystore secrets in the v1.0 release phase.
      # TMDB_API_KEY and OPENROUTER_API_KEY come from repo secrets (Settings
      # > Secrets and variables > Actions). Without --dart-define here,
      # AppConfig.tmdbToken/openRouterKey fall back to their defaults in
      # lib/utils/config.dart (TMDB still works via its baked-in fallback;
      # OpenRouter/Ask-AI does NOT, its fallback is empty).
      - run: >
          flutter build apk --release
          --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: maxplayer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
