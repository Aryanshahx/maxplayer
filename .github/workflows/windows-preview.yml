name: Windows desktop preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: desktop/hyper_player
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name hyper_player --org com.hypertechlabs .
      - name: Set Windows product branding
        shell: pwsh
        run: |
          $resource = 'windows/runner/Runner.rc'
          $text = Get-Content $resource -Raw
          $text = $text.Replace('"CompanyName", "com.hypertechlabs"', '"CompanyName", "Hyper Tech Labs"')
          $text = $text.Replace('"FileDescription", "hyper_player"', '"FileDescription", "Hyper Player - All Formats"')
          $text = $text.Replace('"ProductName", "hyper_player"', '"ProductName", "Hyper Player - All Formats"')
          [IO.File]::WriteAllText((Join-Path $PWD $resource), $text)
          $runner = 'windows/runner/main.cpp'
          $main = Get-Content $runner -Raw
          $main = $main.Replace('L"hyper_player"', 'L"Hyper Player - All Formats"')
          [IO.File]::WriteAllText((Join-Path $PWD $runner), $main)
      - name: Remove generated demo test
        shell: pwsh
        run: Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows with Discover token
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TMDB_API_KEY)) {
            throw "TMDB_API_KEY is missing. Add the TMDB read-access token to repository Actions secrets."
          }
          @{ TMDB_API_KEY = $env:TMDB_API_KEY } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 -NoNewline "$env:RUNNER_TEMP/hyper-discover.json"
          try {
            flutter build windows --release "--dart-define-from-file=$env:RUNNER_TEMP/hyper-discover.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item "$env:RUNNER_TEMP/hyper-discover.json" -ErrorAction SilentlyContinue
          }
      - name: Bundle complete portable application
        shell: pwsh
        run: |
          Copy-Item README.md build/windows/x64/runner/Release/README.txt
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Hyper-Player-Windows-x64-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hyper-Player-Windows-x64-preview
          path: desktop/hyper_player/Hyper-Player-Windows-x64-preview.zip
          retention-days: 14
          if-no-files-found: error
