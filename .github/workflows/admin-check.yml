name: Check admin panel
on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/admin-check.yml']
  pull_request:
    paths: ['admin/**', '.github/workflows/admin-check.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check admin/admin.mjs
      - run: node --test admin/push-core.test.mjs admin/charts.test.mjs admin/control-panel.test.mjs
