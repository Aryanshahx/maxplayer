# Play Store release build — a SIGNED Android App Bundle (.aab).
#
# Package: com.hypertechlabs.maxplayer (UPDATE to the existing Play listing).
# Play only accepts .aab for updates. This workflow restores the upload
# keystore from repository secrets, writes android/key.properties, builds the
# AAB and attaches it to the run's artifacts.
#
# Use the SAME four secret names as Codemagic so one set of credentials
# drives both CI systems. Create them under GitHub:
#   Settings → Secrets and variables → Actions → Secrets (tab) → New secret
#
#   CM_KEYSTORE            = base64 of android/app/upload-keystore.jks
#                            (generate with scripts/make_upload_keystore.sh)
#   CM_KEYSTORE_PASSWORD   = the keystore store password
#   CM_KEY_ALIAS           = the key alias (default: upload)
#   CM_KEY_ALIAS_PASSWORD  = the key password
#   TMDB_API_KEY           = TMDB v4 read token (dart-define)
#   OPENROUTER_API_KEY     = OpenRouter key (dart-define)
#
# IMPORTANT — signing for an UPDATE:
#   Google Play only accepts an update signed by a key that matches the app.
#   If the old app is on Play App Signing (default for apps created after
#   ~2021): in Play Console → Setup → App signing → "Request upload key
#   reset", then register the keystore produced by make_upload_keystore.sh.
#   The values of those 4 secrets are that upload key's credentials.
name: Play Store AAB

on:
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab
  push:
    tags: ['v*']              # or build on every tagged push

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Check signing secrets
        env:
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_ALIAS_PASSWORD: ${{ secrets.CM_KEY_ALIAS_PASSWORD }}
        run: |
          if [ -z "$CM_KEYSTORE" ] || [ -z "$CM_KEYSTORE_PASSWORD" ] \
             || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_ALIAS_PASSWORD" ]; then
            echo "::error::Missing signing secrets. Add CM_KEYSTORE,"
            echo "::error::CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS and"
            echo "::error::CM_KEY_ALIAS_PASSWORD under"
            echo "::error::Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Restore upload keystore
        env:
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_ALIAS_PASSWORD: ${{ secrets.CM_KEY_ALIAS_PASSWORD }}
        run: |
          echo "$CM_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_ALIAS_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/app/upload-keystore.jks android/key.properties

      - name: Build signed AAB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          flutter build appbundle --release \
            "--dart-define=TMDB_API_KEY=$TMDB_API_KEY" \
            "--dart-define=OPENROUTER_API_KEY=$OPENROUTER_API_KEY"

      - name: Clean up secrets from the runner
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxplayer-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
