# Play Store release build — a SIGNED Android App Bundle (.aab).
#
# Package: com.hypertechlabs.maxplayer (UPDATE to the existing Play listing).
# Play only accepts .aab for updates. This workflow restores the upload
# keystore from repository secrets, writes android/key.properties, builds the
# AAB and attaches it to the run's artifacts.
#
# Use the SAME four secret names as Codemagic so one set of credentials
# drives both CI systems. Create them under GitHub:
#   Settings → Secrets and variables → Actions → Secrets (tab) → New secret
#
#   CM_KEYSTORE            = base64 of android/app/upload-keystore.jks
#                            (generate with scripts/make_upload_keystore.sh)
#   CM_KEYSTORE_PASSWORD   = the keystore store password
#   CM_KEY_ALIAS           = the key alias (default: upload)
#   CM_KEY_ALIAS_PASSWORD  = the key password
#   TMDB_API_KEY           = TMDB v4 read token (dart-define)
#   OPENROUTER_API_KEY     = OpenRouter key (dart-define)
#
# IMPORTANT — signing for an UPDATE:
#   Google Play only accepts an update signed by a key that matches the app.
#   If the old app is on Play App Signing (default for apps created after
#   ~2021): in Play Console → Setup → App signing → "Request upload key
#   reset", then register the keystore produced by make_upload_keystore.sh.
#   The values of those 4 secrets are that upload key's credentials.
name: Play Store AAB

on:
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    tags: ['v*']              # or build on every tagged push

permissions:
  contents: read

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # v1.0.1+65: PINNED to the last working Flutter — stable moved
          # to 3.50 which demands Gradle 9.3.1 / deprecates material.dart.
          # We deliberately stay on the +62-era toolchain.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: python3 -m unittest discover -s scripts/release -p '*_test.py'
      - run: python3 scripts/release/verify_ad_id.py android/app/src/main/AndroidManifest.xml
      - run: flutter --version
      - run: flutter pub get
      # v1.0.1+64: --no-fatal-infos — newer Flutter stables flag
      # material.dart etc. as "deprecated" INFOS; infos must never
      # block the build. Errors and warnings still fail the job.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Check signing secrets
        env:
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_ALIAS_PASSWORD: ${{ secrets.CM_KEY_ALIAS_PASSWORD }}
        run: |
          if [ -z "$CM_KEYSTORE" ] || [ -z "$CM_KEYSTORE_PASSWORD" ] \
             || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_ALIAS_PASSWORD" ]; then
            echo "::error::Missing signing secrets. Add CM_KEYSTORE,"
            echo "::error::CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS and"
            echo "::error::CM_KEY_ALIAS_PASSWORD under"
            echo "::error::Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Restore upload keystore
        env:
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_ALIAS_PASSWORD: ${{ secrets.CM_KEY_ALIAS_PASSWORD }}
        run: |
          echo "$CM_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_ALIAS_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/app/upload-keystore.jks android/key.properties

      - name: Build signed AAB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          flutter build appbundle --release \
            "--dart-define=TMDB_API_KEY=$TMDB_API_KEY" \
            "--dart-define=OPENROUTER_API_KEY=$OPENROUTER_API_KEY"

      - name: Verify signed bundle
        run: |
          BUNDLE=build/app/outputs/bundle/release/app-release.aab
          test -s "$BUNDLE"
          # Refuse an unsigned/debug fallback bundle: the release key file must exist.
          test -s android/key.properties
          jarsigner -verify "$BUNDLE"
          python3 - <<'PY_VERIFY'
          import zipfile
          p='build/app/outputs/bundle/release/app-release.aab'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert 'base/manifest/AndroidManifest.xml' in names, 'Missing bundle manifest'
              assert any(n.upper().startswith('META-INF/') and n.upper().endswith('.SF') for n in names), 'Missing JAR signature'
          PY_VERIFY

      - name: Check final AAB Advertising ID permission
        run: |
          TOOL="$RUNNER_TEMP/bundletool.jar"
          curl --fail --location --retry 3 -o "$TOOL" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $TOOL" | sha256sum --check
          java -jar "$TOOL" dump manifest --bundle=build/app/outputs/bundle/release/app-release.aab --module=base > "$RUNNER_TEMP/manifest.xml"
          python3 scripts/release/verify_ad_id.py "$RUNNER_TEMP/manifest.xml"

      - name: Clean up secrets from the runner
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxplayer-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
