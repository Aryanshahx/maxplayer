name: hyper_player
description: Hyper Player Windows desktop preview.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  cryptography: ^2.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_windows_video: ^1.0.11
  file_selector: ^1.0.3
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/fonts/anton-OFL.txt
    - assets/fonts/spacemono-OFL.txt
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
