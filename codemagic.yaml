workflows:
  android-apk:
    name: Max Player - Android APK + AAB
    max_build_duration: 60
    environment:
      flutter: 3.44.9
      groups:
        - keystore_credentials
      vars:
        CM_KEYSTORE_PATH: /tmp/maxplayer-upload.keystore
    scripts:
      - name: Prepare upload key (optional)
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_KEYSTORE_PATH"
            {
              echo "storePassword=$CM_KEYSTORE_PASSWORD"
              echo "keyPassword=$CM_KEY_ALIAS_PASSWORD"
              echo "keyAlias=$CM_KEY_ALIAS"
              echo "storeFile=$CM_KEYSTORE_PATH"
            } > android/key.properties
            echo "Upload key configured - release will be Play-Store signed."
          else
            echo "No upload key configured - release signs with the debug key."
          fi
      - name: Clean build (avoid stale plugin registration after dependency upgrades)
        script: flutter clean
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK (release, ALL CPUs - sideload/WhatsApp build)
        script: flutter build apk --release --dart-define=TMDB_API_KEY=$TMDB_API_KEY --dart-define=OPENROUTER_API_KEY=$OPENROUTER_API_KEY --dart-define=OPENSUBTITLES_API_KEY=$OPENSUBTITLES_API_KEY --dart-define=PUTER_API_KEY=$PUTER_API_KEY
      - name: Build AAB for the Play Store (release, ALL CPUs)
        script: flutter build appbundle --release --dart-define=TMDB_API_KEY=$TMDB_API_KEY --dart-define=OPENROUTER_API_KEY=$OPENROUTER_API_KEY --dart-define=OPENSUBTITLES_API_KEY=$OPENSUBTITLES_API_KEY --dart-define=PUTER_API_KEY=$PUTER_API_KEY
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
