workflows:
  android-apk:
    name: Max Player - Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      # No android_signing block yet - this ships a debug-signed APK, which is
      # fine for sideloading and testing. Add an android_signing entry here
      # later once you've created a keystore and registered it in
      # Codemagic > Team settings > Code signing identities, for a real release build.
    scripts:
      - name: Clean build (avoid stale plugin registration after dependency upgrades)
        script: flutter clean
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK (release, arm64 only)
        # --target-platform makes the Flutter TOOL package only arm64 engine
        # + plugin libs (ndk.abiFilters alone doesn't strip the Flutter
        # artefacts). This is what cut the APK from ~93 MB to ~33 MB.
        script: flutter build apk --release --target-platform=android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
